    <!-- Apply the saved theme before first paint, so there is no flash. The
         portfolio is designed dark first, so that is the default for every new
         visitor regardless of their OS setting; the toggle is remembered after. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('aks-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* private mode — dark it is */
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
